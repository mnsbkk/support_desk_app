{% extends "base.html" %}
{% block title %}Edit ticket{% endblock %}
{% block content %}
    <!-- Form to update an existing support ticket. -->
    <h1>Edit ticket</h1>

    <form method="POST" action="{{ url_for('edit_ticket', ticket_id=ticket['id']) }}" class="ticket-form" novalidate>
        <div class="form-row">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required value="{{ form['name'] }}">
        </div>

        <div class="form-row">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required value="{{ form['email'] }}">
        </div>

        <div class="form-row">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required maxlength="120" value="{{ form['subject'] }}">
        </div>

        <div class="form-row">
            <label for="description">Description</label>
            <textarea id="description" name="description" required maxlength="1000">{{ form['description'] }}</textarea>
            <small class="char-counter"><span id="char-count">0</span> / 1000</small>
        </div>

        <div class="form-row">
            <label for="status">Status</label>
            <select id="status" name="status">
                {% for s in status_options %}
                    <option value="{{ s }}" {% if form['status'] == s %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="actions">
            <button type="submit" class="button">Save</button>
            <a class="button secondary" href="{{ url_for('detail_ticket', ticket_id=ticket['id']) }}">Cancel</a>
        </div>
    </form>
{% endblock %}
